[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamba3jp"
version = "0.1.0"
description = "Mamba-3 small Japanese LM pretrained on Qwen3-Swallow distilled data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "sotanengel" }]

dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "zstandard>=0.22",
    "transformers>=4.45",
    "tokenizers>=0.20",
    "sentencepiece>=0.2",
    "wandb>=0.17",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.3",
    "bitsandbytes>=0.43",
]
eval = [
    "lm-eval==0.4.2",
    "datasets>=2.20",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-tqdm",
    "pre-commit>=3.0",
]

[project.urls]
Repository = "https://github.com/sotanengel/mamba-3-powered-by-qwen3-swallow"
Issues = "https://github.com/sotanengel/mamba-3-powered-by-qwen3-swallow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "gpu: requires CUDA GPU (skipped by default; pass --run-gpu to enable)",
    "slow: long-running test (skipped by default; pass --run-slow to enable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/mamba3jp"]

[[tool.mypy.overrides]]
module = ["mamba_ssm.*", "bitsandbytes.*", "wandb.*", "zstandard.*"]
ignore_missing_imports = true
