# Training hyperparameters.
# Derived from the requirements doc §7.2 and tuned for RTX 3060 Ti (8 GB).
seed: 42

# data
seq_len: 2048
batch_size: 1
num_workers: 4

# optimizer
lr: 2.0e-4
betas: [0.9, 0.95]
weight_decay: 0.0
eight_bit_adam: true
clip_grad: 1.0
grad_accum: 8

# schedule
warmup_pct: 0.02
min_lr_ratio: 0.1
max_steps: 100000

# precision
use_amp: true     # bf16 autocast on CUDA
gradient_checkpointing: true

# logging / checkpointing
log_interval: 10
eval_interval: 500
save_interval: 1000
keep_ckpt: 3

# wandb
wandb_project: mamba3-jp
wandb_entity: null
wandb_run_name: null  # auto-derived from model name + timestamp if null
