name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU-only deps)
        run: |
          python -m pip install --upgrade pip
          # CPU torch is enough for CPU-marked tests; GPU tests are skipped by default.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: pytest
        run: pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-PyYAML types-tqdm
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/mamba3jp || true  # informational until modules are fleshed out
